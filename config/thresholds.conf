# config/thresholds.conf — limites de severidade (🟡 Atenção / 🔴 Crítico)
#
# Este arquivo é lido pelo audit.sh como script Bash (apenas atribuições).
# Os valores abaixo são os padrões; ajuste conforme os primeiros relatórios.

# Armazenamento: percentual de uso de disco e de inodes
DISK_WARN_PCT=80
DISK_CRIT_PCT=90
INODE_WARN_PCT=80
INODE_CRIT_PCT=90

# Memória: percentual em uso (considera MemAvailable, sem contar cache)
MEM_WARN_PCT=85

# Atualizações: a partir de quantos pacotes pendentes marcar 🟡
UPDATES_WARN_COUNT=1

# Atualizações: idade máxima (em dias) do índice do apt antes de alertar.
# Índice velho faz a contagem de pendências ficar subestimada.
UPDATES_CACHE_WARN_DAYS=14

# Docker: nomes de containers ESSENCIAIS, separados por espaço. Se algum deles
# não estiver em execução (ou não existir), o relatório marca 🔴 Crítico.
# Exemplo: DOCKER_ESSENTIAL="nginx stirling-pdf"
DOCKER_ESSENTIAL=""

# Docker: container parado com código de saída diferente de zero só gera 🟡 se
# tiver terminado há no máximo esta quantidade de dias. Stacks desligadas de
# propósito (código 137/143 após `docker stop`) deixam de alarmar com o tempo.
DOCKER_EXIT_WARN_DAYS=7

# Segurança: 1 = marcar 🟡 quando o SSH aceita login por senha
# (PasswordAuthentication yes); 0 = não marcar (a tabela continua mostrando).
SSH_PASSWORD_AUTH_WARN=1