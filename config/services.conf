# config/services.conf — serviços systemd monitorados pelo coletor services.sh
#
# Um serviço por linha (com ou sem o sufixo .service). '#' inicia comentário.
# Serviço não instalado no servidor aparece como "não instalado", sem alarme.
#
# Regra de severidade:
#   🔴 Crítico  — em estado failed, ou parado embora habilitado (enabled)
#   🟡 Atenção  — em transição (activating, deactivating, reloading)
#   sem alarme  — inativo e desabilitado, mascarado ou não instalado
#
# Linhas começando com "!" tiram um serviço da lista de FALHAS (ele continua
# registrado no estado como "ignored_failed", só não gera alarme). Útil para
# falhas conhecidas e sem importância.
#
# Sem serviços listados, vale a lista padrão: ssh, docker, nginx, cron.

ssh
docker
nginx
cron

# Falha comum no Ubuntu quando a rede é gerenciada por outro serviço
# (NetworkManager, netplan): o "wait-online" do systemd-networkd não é usado.
!systemd-networkd-wait-online